<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garage Fit">
<title>Garage Fit</title>
<style>
  :root{
    --ink:#14181a;
    --surface:#1e2624;
    --surface-2:#242e2b;
    --work:#f2a93b;
    --work-dim:#4a3a20;
    --rest:#4fbf8b;
    --rest-dim:#20362c;
    --text:#f5f3ee;
    --text-muted:#8a9290;
    --danger:#e2665a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none; user-select:none;
  }
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .screen{ flex:1; display:flex; flex-direction:column; }
  .hidden{ display:none !important; }

  /* ---------- HOME ---------- */
  #home{ padding:20px; }
  .home-header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:28px; margin-top:8px;
  }
  .home-title{
    font-size:15px; font-weight:800; letter-spacing:0.12em;
    color:var(--text-muted); text-transform:uppercase;
  }
  .equip-toggle{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--surface-2);
    border-radius:999px; padding:8px 14px;
    font-size:13px; font-weight:700; color:var(--text);
  }
  .tiles{
    flex:1; display:grid; grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr; gap:14px;
  }
  .tile{
    border:none; border-radius:20px; background:var(--surface);
    display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end;
    padding:20px; position:relative; overflow:hidden;
  }
  .tile:active{ transform:scale(0.97); }
  .tile .glyph{ font-size:34px; margin-bottom:10px; }
  .tile .label{
    font-size:20px; font-weight:900; letter-spacing:0.02em;
    text-transform:uppercase; line-height:1.1;
  }
  .tile .sub{ font-size:12px; color:var(--text-muted); margin-top:4px; font-weight:600; }
  #tile-warmup{ background:linear-gradient(155deg, var(--surface) 60%, var(--work-dim)); }
  #tile-rampup{ background:linear-gradient(155deg, var(--surface) 60%, #3a2020); }
  #tile-cooldown{ background:linear-gradient(155deg, var(--surface) 60%, var(--rest-dim)); }
  #tile-snack{ background:linear-gradient(155deg, var(--surface) 60%, #20303a); }

  /* ---------- PLAYER ---------- */
  #player{ align-items:center; justify-content:space-between; padding:20px 20px 30px; }
  .player-top{ width:100%; display:flex; justify-content:space-between; align-items:center; }
  .close-btn{
    background:none; border:none; color:var(--text-muted);
    font-size:28px; line-height:1; padding:6px 10px;
  }
  .routine-name{
    font-size:13px; font-weight:800; letter-spacing:0.1em;
    color:var(--text-muted); text-transform:uppercase;
  }
  .progress-count{ font-size:13px; color:var(--text-muted); font-weight:700; }

  .ring-wrap{ position:relative; width:min(70vw, 320px); height:min(70vw,320px); margin:10px 0; }
  svg.ring{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--surface); stroke-width:14; }
  .ring-fg{ fill:none; stroke:var(--work); stroke-width:14; stroke-linecap:round;
    transition:stroke-dashoffset 0.25s linear, stroke 0.3s ease; }
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .phase-label{
    font-size:13px; font-weight:800; letter-spacing:0.15em; text-transform:uppercase;
    color:var(--work); margin-bottom:4px;
  }
  .timer-num{
    font-size:64px; font-weight:900; font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .reps-num{ font-size:18px; font-weight:700; color:var(--text-muted); margin-top:6px; }

  .exercise-name{
    font-size:28px; font-weight:900; text-align:center; text-transform:uppercase;
    letter-spacing:0.01em; margin:6px 20px 0; min-height:70px;
    display:flex; align-items:center; justify-content:center;
  }
  .next-preview{
    font-size:14px; color:var(--text-muted); font-weight:600; margin-top:6px; text-align:center;
  }

  .controls{ width:100%; display:flex; gap:12px; margin-top:20px; }
  .ctrl-btn{
    flex:1; border:none; border-radius:16px; padding:18px 0;
    font-size:16px; font-weight:800; letter-spacing:0.03em; text-transform:uppercase;
  }
  .ctrl-secondary{ background:var(--surface); color:var(--text); }
  .ctrl-primary{ background:var(--work); color:#1a1200; }

  /* ---------- SNACK PICKER ---------- */
  #snackpick{ padding:24px 20px; }
  .snack-header{ margin-bottom:20px; margin-top:8px; }
  .snack-header h1{ font-size:22px; margin:0 0 4px; font-weight:900; text-transform:uppercase; }
  .snack-header p{ margin:0; color:var(--text-muted); font-size:14px; }
  .snack-cards{ display:flex; flex-direction:column; gap:12px; }
  .snack-card{
    background:var(--surface); border:none; border-radius:18px;
    padding:20px; text-align:left; display:flex; justify-content:space-between; align-items:center;
  }
  .snack-card .name{ font-size:18px; font-weight:800; text-transform:uppercase; }
  .snack-card .dur{ font-size:13px; color:var(--text-muted); font-weight:700; }
  .snack-reshuffle{
    margin-top:16px; background:none; border:1px dashed var(--surface-2);
    color:var(--text-muted); border-radius:14px; padding:14px; font-weight:700; font-size:14px;
  }

  /* ---------- DONE ---------- */
  #done{ align-items:center; justify-content:center; text-align:center; padding:20px; }
  #done .check{ font-size:70px; margin-bottom:10px; }
  #done h1{ font-size:26px; font-weight:900; text-transform:uppercase; margin:0 0 8px; }
  #done p{ color:var(--text-muted); margin:0 0 30px; }
  #done .ctrl-btn{ width:70%; }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div id="home" class="screen">
    <div class="home-header">
      <div class="home-title">Garage Fit</div>
      <button class="equip-toggle" id="equipToggle"></button>
    </div>
    <div class="tiles">
      <button class="tile" id="tile-warmup" onclick="startRoutine('warmup')">
        <div class="glyph">🔥</div>
        <div class="label">Warm Up</div>
        <div class="sub" id="warmupSub"></div>
      </button>
      <button class="tile" id="tile-rampup" onclick="startRoutine('rampup')">
        <div class="glyph">⚡</div>
        <div class="label">Ramp Up</div>
        <div class="sub">7 moves · reps</div>
      </button>
      <button class="tile" id="tile-cooldown" onclick="startRoutine('cooldown')">
        <div class="glyph">🧘</div>
        <div class="label">Cool Down</div>
        <div class="sub" id="cooldownSub"></div>
      </button>
      <button class="tile" id="tile-snack" onclick="openSnack()">
        <div class="glyph">🍿</div>
        <div class="label">Snack</div>
        <div class="sub">quick pick</div>
      </button>
    </div>
  </div>

  <!-- SNACK PICKER -->
  <div id="snackpick" class="screen hidden">
    <div class="snack-header">
      <h1>Pick one</h1>
      <p>A couple of minutes is all it takes</p>
    </div>
    <div class="snack-cards" id="snackCards"></div>
    <button class="snack-reshuffle" onclick="renderSnackPicker()">🔀 Show different options</button>
    <button class="ctrl-btn ctrl-secondary" style="margin-top:14px;" onclick="goHome()">Cancel</button>
  </div>

  <!-- PLAYER -->
  <div id="player" class="screen hidden">
    <div class="player-top">
      <button class="close-btn" onclick="confirmExit()">✕</button>
      <div class="routine-name" id="routineName"></div>
      <div class="progress-count" id="progressCount"></div>
    </div>

    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 200 200">
        <circle class="ring-bg" cx="100" cy="100" r="90"></circle>
        <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="90"
          stroke-dasharray="565.48" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ring-center">
        <div class="phase-label" id="phaseLabel">GET READY</div>
        <div class="timer-num" id="timerNum">3</div>
        <div class="reps-num hidden" id="repsNum"></div>
      </div>
    </div>

    <div class="exercise-name" id="exerciseName">Get ready</div>
    <div class="next-preview" id="nextPreview">&nbsp;</div>

    <div class="controls">
      <button class="ctrl-btn ctrl-secondary" id="pauseBtn" onclick="togglePause()">Pause</button>
      <button class="ctrl-btn ctrl-primary" onclick="skipPhase()">Skip</button>
    </div>
  </div>

  <!-- DONE -->
  <div id="done" class="screen hidden">
    <div class="check">✅</div>
    <h1 id="doneTitle">Done!</h1>
    <p id="doneSub">Nice work.</p>
    <button class="ctrl-btn ctrl-primary" onclick="goHome()">Back to home</button>
  </div>

</div>

<script>
/* ============ DATA ============ */
const WORK_S = 15, REST_S = 5;

const EX = {
  warmupEquip: ["Knees up","Bum kicks","Open gates, close gates","Hand to opposite toe","Body hoops","Body twists",
    "Arm circles backwards","Arm circles forwards","Arm side circles","TRX squat to overhead press","TRX lunge",
    "Band pull-apart (palms up)","Walk to plank and push up","Star jumps","Burpees","Hangout on a pullup bar",
    "Kettlebell figure-of-eight"].map(n => ({name:n, work:WORK_S, rest:REST_S})),

  warmupNoEquip: ["Knees up","Bum kicks","Open gates, close gates","Hand to opposite toe","Body hoops","Body twists",
    "Arm circles backwards","Arm circles forwards","Arm side circles","Air squats","Step back lunges left-right",
    "Walk to plank and push up","Star jumps","Burpees"].map(n => ({name:n, work:WORK_S, rest:REST_S})),

  cooldownEquip: ["Toe touch","Inside thigh stretch","Wide toe touch","Hip flexor + arm across pull + overhead tricep L-R",
    "Kneeling hamstring L-R","Frog","Standing quads","Downward dog to upward dog","Plank calf stretch","Pigeon",
    "TRX lean back and sink","TRX lunge, calf and chest opener","TRX glute standing","TRX side stretch",
    "Lying torso twist","Full body stretch"].map(n => ({name:n, work:WORK_S, rest:REST_S})),

  cooldownNoEquip: ["Toe touch","Inside thigh stretch","Wide toe touch","Hip flexor + arm across pull + overhead tricep L-R",
    "Kneeling hamstring L-R","Frog","Standing quads","Downward dog to upward dog","Plank calf stretch","Pigeon",
    "Lean back and sink","Chest opener","Side stretch","Glute stretch","Lying torso twist",
    "Full body stretch"].map(n => ({name:n, work:WORK_S, rest:REST_S})),

  rampUp: [
    {name:"Jumping jacks", reps:10, work:30, rest:REST_S},
    {name:"Air squat", reps:10, work:30, rest:REST_S},
    {name:"Press ups", reps:10, work:30, rest:REST_S},
    {name:"Toes to bar", reps:5, work:20, rest:REST_S},
    {name:"Kettlebell swings", reps:10, work:30, rest:REST_S},
    {name:"Plank", reps:null, work:30, rest:REST_S},
    {name:"Burpees", reps:10, work:30, rest:0}
  ],

  // Placeholder — swap these out for your own list any time.
  snackPool: [
    {name:"Air squats", work:30},
    {name:"Press ups", work:30},
    {name:"Plank hold", work:30},
    {name:"Star jumps", work:30},
    {name:"Wall sit", work:30}
  ]
};

/* ============ STATE ============ */
let state = {
  key:null, list:[], idx:0, phase:'ready', remaining:0, timer:null,
  paused:false, equipment:true, wakeLock:null
};

/* ============ EQUIPMENT TOGGLE ============ */
function loadEquipment(){
  const v = localStorage.getItem('gf_equipment');
  state.equipment = v === null ? true : v === 'true';
  renderHome();
}
function toggleEquipment(){
  state.equipment = !state.equipment;
  localStorage.setItem('gf_equipment', state.equipment);
  renderHome();
}
function renderHome(){
  document.getElementById('equipToggle').textContent = state.equipment ? '🏋️ Equipment' : '🧍 No equipment';
  document.getElementById('warmupSub').textContent = (state.equipment ? EX.warmupEquip.length : EX.warmupNoEquip.length) + ' moves';
  document.getElementById('cooldownSub').textContent = (state.equipment ? EX.cooldownEquip.length : EX.cooldownNoEquip.length) + ' moves';
}
document.getElementById('equipToggle').addEventListener('click', toggleEquipment);

/* ============ NAV ============ */
function showScreen(id){
  ['home','snackpick','player','done'].forEach(s=>{
    document.getElementById(s).classList.toggle('hidden', s!==id);
  });
}
function goHome(){
  stopTimer();
  releaseWake();
  showScreen('home');
}

/* ============ SOUND / VOICE ============ */
let audioCtx = null;
function beep(freq=880, dur=0.12){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0; u.pitch = 1.0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ WAKE LOCK ============ */
async function requestWake(){
  try{ if('wakeLock' in navigator) state.wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
}
function releaseWake(){
  try{ if(state.wakeLock){ state.wakeLock.release(); state.wakeLock = null; } }catch(e){}
}

/* ============ ROUTINE ENGINE ============ */
function startRoutine(key){
  let list;
  if(key === 'warmup') list = state.equipment ? EX.warmupEquip : EX.warmupNoEquip;
  else if(key === 'cooldown') list = state.equipment ? EX.cooldownEquip : EX.cooldownNoEquip;
  else if(key === 'rampup') list = EX.rampUp;
  state.key = key; state.list = list.slice(); state.idx = 0; state.paused = false;
  document.getElementById('routineName').textContent =
    key === 'warmup' ? 'Warm Up' : key === 'cooldown' ? 'Cool Down' : 'Ramp Up';
  showScreen('player');
  requestWake();
  enterReady();
}

function enterReady(){
  state.phase = 'ready';
  state.remaining = 3;
  updateProgressCount();
  const first = state.list[0];
  document.getElementById('exerciseName').textContent = 'Get ready';
  document.getElementById('nextPreview').textContent = 'First up: ' + first.name;
  setRingColor('rest');
  document.getElementById('phaseLabel').textContent = 'GET READY';
  document.getElementById('repsNum').classList.add('hidden');
  speak('Get ready. ' + first.name);
  runTimer(3, () => enterWork());
}

function enterWork(){
  state.phase = 'work';
  const ex = state.list[state.idx];
  state.remaining = ex.work;
  updateProgressCount();
  document.getElementById('exerciseName').textContent = ex.name;
  document.getElementById('phaseLabel').textContent = state.key === 'rampup' ? 'GO' : 'WORK';
  setRingColor('work');
  const repsEl = document.getElementById('repsNum');
  if(state.key === 'rampup'){
    repsEl.classList.remove('hidden');
    repsEl.textContent = ex.reps ? ('x' + ex.reps + ' reps') : 'hold';
  } else {
    repsEl.classList.add('hidden');
  }
  const isLast = state.idx === state.list.length - 1;
  const next = isLast ? null : state.list[state.idx+1];
  document.getElementById('nextPreview').textContent = next ? ('Next: ' + next.name) : 'Last one!';
  beep(880);
  runTimer(ex.work, () => enterRestOrNext());
}

function enterRestOrNext(){
  const ex = state.list[state.idx];
  const isLast = state.idx === state.list.length - 1;
  if(isLast || !ex.rest){
    finishRoutine();
    return;
  }
  state.phase = 'rest';
  state.remaining = ex.rest;
  updateProgressCount();
  const next = state.list[state.idx+1];
  document.getElementById('exerciseName').textContent = 'Get ready';
  document.getElementById('phaseLabel').textContent = 'REST';
  document.getElementById('repsNum').classList.add('hidden');
  setRingColor('rest');
  document.getElementById('nextPreview').textContent = 'Next: ' + next.name;
  beep(440);
  speak(next.name);
  runTimer(ex.rest, () => { state.idx++; enterWork(); });
}

function finishRoutine(){
  releaseWake();
  document.getElementById('doneTitle').textContent = 'Done!';
  const label = state.key === 'warmup' ? "Warm-up complete. Let's go." :
                state.key === 'cooldown' ? 'Cool-down complete. Nice work.' :
                'Ramp-up complete. Time to train.';
  document.getElementById('doneSub').textContent = label;
  speak(label);
  showScreen('done');
}

function updateProgressCount(){
  document.getElementById('progressCount').textContent = (state.idx+1) + ' / ' + state.list.length;
}

function setRingColor(kind){
  const ring = document.getElementById('ringFg');
  const label = document.getElementById('phaseLabel');
  const color = kind === 'work' ? getComputedStyle(document.documentElement).getPropertyValue('--work')
                                 : getComputedStyle(document.documentElement).getPropertyValue('--rest');
  ring.style.stroke = color.trim();
  label.style.color = color.trim();
}

/* ============ TIMER LOOP ============ */
const RING_CIRC = 565.48;
function runTimer(totalSeconds, onComplete){
  clearInterval(state.timer);
  const start = totalSeconds;
  renderTick(start, start);
  document.getElementById('timerNum').textContent = start;
  state.timer = setInterval(() => {
    if(state.paused) return;
    state.remaining -= 1;
    renderTick(state.remaining, start);
    if(state.remaining <= 0){
      clearInterval(state.timer);
      onComplete();
    }
  }, 1000);
  state._onComplete = onComplete;
  state._start = start;
}
function renderTick(remaining, total){
  document.getElementById('timerNum').textContent = Math.max(remaining,0);
  const ring = document.getElementById('ringFg');
  const frac = Math.max(remaining,0) / total;
  ring.style.strokeDashoffset = RING_CIRC * (1 - frac);
}
function stopTimer(){ clearInterval(state.timer); }

function togglePause(){
  state.paused = !state.paused;
  document.getElementById('pauseBtn').textContent = state.paused ? 'Resume' : 'Pause';
}
function skipPhase(){
  clearInterval(state.timer);
  state.paused = false;
  document.getElementById('pauseBtn').textContent = 'Pause';
  if(state.phase === 'ready') enterWork();
  else if(state.phase === 'work') enterRestOrNext();
  else if(state.phase === 'rest'){ state.idx++; enterWork(); }
}
function confirmExit(){
  stopTimer();
  releaseWake();
  goHome();
}

/* ============ SNACK MODE ============ */
function pickRandom(arr, n){
  const copy = arr.slice();
  const out = [];
  while(copy.length && out.length < n){
    out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);
  }
  return out;
}
let snackChoices = [];
function openSnack(){
  showScreen('snackpick');
  renderSnackPicker();
}
function renderSnackPicker(){
  snackChoices = pickRandom(EX.snackPool, Math.min(3, EX.snackPool.length));
  const wrap = document.getElementById('snackCards');
  wrap.innerHTML = '';
  snackChoices.forEach((ex, i) => {
    const btn = document.createElement('button');
    btn.className = 'snack-card';
    btn.innerHTML = '<span class="name">'+ex.name+'</span><span class="dur">'+ex.work+'s</span>';
    btn.onclick = () => startSnack(i);
    wrap.appendChild(btn);
  });
}
function startSnack(i){
  const ex = snackChoices[i];
  state.key = 'snack';
  state.list = [{name:ex.name, work:ex.work, rest:0}];
  state.idx = 0; state.paused = false;
  document.getElementById('routineName').textContent = 'Snack';
  showScreen('player');
  requestWake();
  enterReady();
}

/* ============ INIT ============ */
loadEquipment();
</script>
</body>
</html>
